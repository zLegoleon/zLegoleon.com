<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        Onlylego — zLegoleon™
    </title>

    <link
            rel="stylesheet"
            href="../../style.css"
    >

</head>


<body>


<div id="site-nav"></div>


<!-- =====================================================
     ONLYLEGO HERO
     ===================================================== -->

<section class="onlylego-hero">

    <div class="onlylego-hero-content">

        <p class="eyebrow">
            zLegoleon™ presents
        </p>

        <h1>
            Onlylego
        </h1>

        <p>
            A collection of things made entirely from
            the most impressive pictures of the goat, zLegolean
        </p>

        <span class="onlylego-scroll-hint">
            Scroll to explore
            <span>↓</span>
        </span>

    </div>


    <div class="onlylego-hero-image">

        <img
                src="../../images/onlylego/hero.png"
                alt="OnlyLego"
        >

    </div>

</section>


<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<main class="subpage">

    <section class="section">

        <div class="section-header">

            <div>

                <p class="eyebrow">
                    OnlyLego
                </p>

                <h2>
                    The Gallery
                </h2>

            </div>

        </div>


        <!-- Your gallery content goes here -->

        <div class="onlylego-gallery">

            <button
                    class="gallery-item"
                    type="button"
                    data-gallery-image="../../images/onlylego/zlegoleantuff1.png"
                    aria-label="Open Tuff 1"
            >
                <img
                        src="../../images/onlylego/zlegoleantuff1.png"
                        alt="Tuff 1"
                >
            </button>


            <button
                    class="gallery-item"
                    type="button"
                    data-gallery-image="../../images/onlylego/zlegoleansigma.jpeg"
                    aria-label="Open Sigma 2"
            >
                <img
                        src="../../images/onlylego/zlegoleansigma.jpeg"
                        alt="Sigma 2"
                >
            </button>


            <button
                    class="gallery-item"
                    type="button"
                    data-gallery-image="../../images/onlylego/zlegoleantuffcollage.jpeg"
                    aria-label="Open TuffCollage 3"
            >
                <img
                        src="../../images/onlylego/zlegoleantuffcollage.jpeg"
                        alt="TuffColage 3"
                >
            </button>

            <button
                    class="gallery-item"
                    type="button"
                    data-gallery-image="../../images/onlylego/zlegoleansunglasses.png"
                    aria-label="Open Sunglasses 4"
            >
                <img
                        src="../../images/onlylego/zlegoleansunglasses.png"
                        alt="Sunglasses 4"
                >
            </button>


            <button
                    class="gallery-item"
                    type="button"
                    data-gallery-image="../../images/onlylego/zlegoleanbeer.png"
                    aria-label="Open Beer 5"
            >
                <img
                        src="../../images/onlylego/zlegoleanbeer.png"
                        alt="Beer 5"
                >
            </button>

            <button
                    class="gallery-item"
                    type="button"
                    data-gallery-image="../../images/onlylego/zlegoleanworkout.png"
                    aria-label="Open Workout 6"
            >
                <img
                        src="../../images/onlylego/zlegoleanworkout.png"
                        alt="Workout 6"
                >
            </button>

        </div>


        <div
                class="gallery-lightbox"
                id="galleryLightbox"
                aria-hidden="true"
        >
            <button
                    class="gallery-lightbox-close"
                    id="galleryLightboxClose"
                    type="button"
                    aria-label="Close image"
            >
                ×
            </button>

            <img
                    id="galleryLightboxImage"
                    src=""
                    alt=""
            >
        </div>


    </section>

</main>


<div id="site-footer"></div>


<script src="../../script.js"></script>

<script src="../../products.js"></script>

<script src="../../store.js"></script>


</body>

</html>
