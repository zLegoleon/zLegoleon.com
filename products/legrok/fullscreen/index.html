<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>Legrok™ — Fullscreen</title>

  <link
          rel="stylesheet"
          href="../../../style.css"
  >

</head>


<body>

<div id="site-nav"></div>


<main class="legrok-fullscreen">

  <div class="legrok-fullscreen-inner">


    <!-- HEADER -->

    <div class="legrok-fullscreen-header">

      <div>

        <div class="legrok-fullscreen-title">

          <span class="legrok-status-dot"></span>

          <strong>
            Legrok™
          </strong>

        </div>

        <span class="legrok-fullscreen-subtitle">
                    Experimental AI
                </span>

      </div>


      <div class="legrok-fullscreen-actions">

        <select id="legrokModel">

          <option value="standard">
            Legrok™
          </option>

          <option value="turbo">
            Legrok™ Turbo
          </option>

          <option value="ultra">
            Legrok™ Ultra™
          </option>

          <option value="premium">
            Legrok™ Premium™
          </option>

          <option value="turboultimate">
            Legrok™ Turbo Ultimate
          </option>


          <option value="ultrapropremuim">
            Legrok™ Ultra Pro Premium Super Smart Turbo Ultimate Hyper 4k UHD 240hz™
          </option>

        </select>

        <a
                href="../"
                class="legrok-fullscreen-exit"
        >
          Exit
        </a>

      </div>

    </div>


    <!-- MESSAGES -->

    <div
            class="legrok-messages"
            id="legrokMessages"
    >

      <div
              class="legrok-message legrok-message-ai"
      >

        <div class="legrok-message-name">
          Legrok™
        </div>

        <p>
          Hello. I am Legrok™.
          <br>
          Ask me anything.
          I will probably not know the answer!
        </p>

      </div>

    </div>


    <!-- INPUT -->

    <div class="legrok-input-area">

      <input
              type="text"
              id="legrokInput"
              placeholder="Ask Legrok™ anything..."
              autocomplete="off"
      >

      <button
              type="button"
              id="legrokSend"
      >
        Send
      </button>

    </div>


  </div>

</main>


<div id="site-footer"></div>


<script src="../../../script.js"></script>

<script src="../../../products.js"></script>

<script src="../../../store.js"></script>

<script src="../legrok.js"></script>

</body>

</html>
